name: Flutter CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  analyze:
    name: Analyze and Test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      
      - name: Analyze project source
        run: flutter analyze 2>&1 | tee analyze.log && ! grep -q "error •" analyze.log
      
      - name: Run tests
        run: flutter test --exclude-tags=smoke --exclude-tags=integration
      
      - name: Check for outdated dependencies
        run: flutter pub outdated

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build Web
        run: |
          flutter build web --release \
            --web-renderer html \
            --dart-define=dart.vm.product=true \
            --tree-shake-icons \
            --pwa-strategy=offline-first \
            --base-href=/
          
          # Compress assets for faster loading
          find build/web -type f \( -name "*.js" -o -name "*.css" -o -name "*.html" \) \
            -exec gzip -9 -k {} \;
          
          # Show build size
          du -sh build/web
          echo "Compressed assets:"
          find build/web -name "*.gz" | wc -l
      
      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

  build-and-push-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [analyze, build-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web
      
      - name: Verify build artifact
        run: ls -la web/
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for web image
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=semver,pattern={{version}}
      
      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Extract metadata for pocketbase image
        id: meta-pb
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/pocketbase
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=semver,pattern={{version}}
      
      - name: Build and push pocketbase image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.pocketbase
          push: true
          tags: ${{ steps.meta-pb.outputs.tags }}
          labels: ${{ steps.meta-pb.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Update dev deployment annotation
        run: |
          # Update the image-version annotation to trigger ArgoCD rolling deployment
          SHORT_SHA="${GITHUB_SHA:0:7}"
          sed -i "s/image-version: \".*\"/image-version: \"main-${SHORT_SHA}\"/" iaac/dev/web.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add iaac/dev/web.yaml
          git commit -m "Deploy: Update dev image to main-${SHORT_SHA} [skip ci]" || echo "No changes to commit"
          git push
