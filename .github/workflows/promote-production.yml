name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to promote (e.g., main-abc1234)'
        required: true
        type: string
      confirm:
        description: 'Type "PRODUCTION" to confirm'
        required: true
        type: string

jobs:
  promote-production:
    name: Promote to Production
    runs-on: ubuntu-latest
    # Only org members can promote to production
    if: github.actor_id == github.repository_owner_id || contains(fromJSON('["awilmoth"]'), github.actor)
    
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "PRODUCTION" ]; then
            echo "❌ Confirmation failed. You must type 'PRODUCTION' to proceed."
            exit 1
          fi
      
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update production manifests
        run: |
          TAG="${{ inputs.image_tag }}"
          
          # Update web image
          sed -i "s|image: ghcr.io/transharbor-org/transharbor/web:.*|image: ghcr.io/transharbor-org/transharbor/web:${TAG}|g" iaac/app/web.yaml
          
          # Update pocketbase image
          sed -i "s|image: ghcr.io/transharbor-org/transharbor/pocketbase:.*|image: ghcr.io/transharbor-org/transharbor/pocketbase:${TAG}|g" iaac/app/pocketbase.yaml
          
          cat iaac/app/web.yaml
          cat iaac/app/pocketbase.yaml
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add iaac/app/
          git commit -m "🚀 Promote to production: ${{ inputs.image_tag }}"
          git push
      
      - name: Trigger ArgoCD sync
        uses: clowdhaus/argo-cd-action@v2.2.0
        with:
          command: app sync transharbor-app
          options: --server-creds
        env:
          ARGOCD_SERVER: dev.transharbor.org:443
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
      
      - name: Create deployment tag
        run: |
          TAG="${{ inputs.image_tag }}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          git tag -a "prod-${TIMESTAMP}" -m "Production deployment: ${TAG}"
          git push origin "prod-${TIMESTAMP}"
