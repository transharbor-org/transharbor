apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transharbor-dev
  namespace: transharbor
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/service.serversscheme: http
spec:
  tls:
  - hosts:
    - dev.transharbor.org
    secretName: dev-transharbor-tls
  rules:
  - host: dev.transharbor.org
    http:
      paths:
      # Flutter web app - all paths go to nginx which will proxy /api internally
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-dev
            port:
              number: 80
