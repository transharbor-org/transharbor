apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transharbor-dev
  namespace: transharbor
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  tls:
  - hosts:
    - dev.transharbor.org
    secretName: dev-transharbor-tls
  rules:
  - host: dev.transharbor.org
    http:
      paths:
      # PocketBase API - must come first for priority
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: pocketbase-dev
            port:
              name: http
      # PocketBase Admin UI
      - path: /_
        pathType: Prefix
        backend:
          service:
            name: pocketbase-dev
            port:
              name: http
      # Flutter web app - catch-all
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-dev
            port:
              number: 80
