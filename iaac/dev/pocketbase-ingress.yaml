apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pocketbase-api-dev
  namespace: transharbor
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - api-dev.transharbor.org
    secretName: api-dev-transharbor-tls
  rules:
  - host: api-dev.transharbor.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pocketbase-dev
            port:
              number: 8080
