apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pocketbase-data-dev
  namespace: transharbor
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocketbase-dev
  namespace: transharbor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pocketbase
      env: dev
  template:
    metadata:
      labels:
        app: pocketbase
        env: dev
    spec:
      priorityClassName: high-priority
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: pocketbase
        image: ghcr.io/transharbor-org/transharbor/pocketbase:main
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "500m"
            memory: "128Mi"
        volumeMounts:
        - name: data
          mountPath: /pb_data
        env:
        - name: PB_ADMIN_EMAIL
          value: "admin@transharbor.org"
        - name: PB_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pocketbase-admin-dev
              key: password
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pocketbase-data-dev
---
apiVersion: v1
kind: Service
metadata:
  name: pocketbase-dev
  namespace: transharbor
spec:
  selector:
    app: pocketbase
    env: dev
  ports:
  - port: 8080
    targetPort: 8080
