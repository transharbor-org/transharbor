---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-dev
  namespace: transharbor
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web
      env: dev
  template:
    metadata:
      labels:
        app: web
        env: dev
      annotations:
        # Update this SHA to trigger rolling deployment via ArgoCD
        image-version: "main-70a0b70"
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: web
        image: ghcr.io/transharbor-org/transharbor/web:main-70a0b70
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
        volumeMounts:
        - name: cache
          mountPath: /var/cache/nginx
        - name: run
          mountPath: /var/run
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "500m"
            memory: "128Mi"
        env:
        - name: POCKETBASE_URL
          value: "http://pocketbase-dev:8080"
      volumes:
      - name: cache
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
      - name: run
        emptyDir:
          medium: Memory
          sizeLimit: 8Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-dev-pdb
  namespace: transharbor
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web
      env: dev
---
apiVersion: v1
kind: Service
metadata:
  name: web-dev
  namespace: transharbor
spec:
  selector:
    app: web
    env: dev
  ports:
  - port: 80
    targetPort: 80
