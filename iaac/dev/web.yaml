---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-dev
  namespace: transharbor
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web
      env: dev
  template:
    metadata:
      labels:
        app: web
        env: dev
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: web
        image: ghcr.io/transharbor-org/transharbor/web:main
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        env:
        - name: POCKETBASE_URL
          value: "http://pocketbase-dev:8080"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-dev-pdb
  namespace: transharbor
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web
      env: dev
---
apiVersion: v1
kind: Service
metadata:
  name: web-dev
  namespace: transharbor
spec:
  selector:
    app: web
    env: dev
  ports:
  - port: 80
    targetPort: 80
