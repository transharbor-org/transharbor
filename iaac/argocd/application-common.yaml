apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: transharbor-common
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/transharbor-org/transharbor.git
    targetRevision: main
    path: iaac/common
  destination:
    server: https://kubernetes.default.svc
    namespace: transharbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
