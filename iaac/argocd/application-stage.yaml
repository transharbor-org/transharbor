apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: transharbor-stage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/transharbor-org/transharbor.git
    targetRevision: main
    path: iaac/stage
  destination:
    server: https://kubernetes.default.svc
    namespace: transharbor
  syncPolicy:
    # Stage requires manual promotion from dev
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
