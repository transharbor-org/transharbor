---
# Kubernetes Secret for Hetzner Storage Box credentials
# Create this BEFORE deploying the CronJob
apiVersion: v1
kind: Secret
metadata:
  name: pocketbase-backup-credentials
  namespace: transharbor
type: Opaque
stringData:
  # Hetzner Storage Box details
  # Get these from: https://robot.hetzner.com/storage
  STORAGE_BOX_HOST: "u123456.your-storagebox.de"
  STORAGE_BOX_USER: "u123456"
  STORAGE_BOX_PATH: "/backups/pocketbase"
  
  # SSH private key for SFTP authentication
  # Generate with: ssh-keygen -t ed25519 -f ~/.ssh/hetzner_backup
  # Add public key to Storage Box at: https://robot.hetzner.com/storage/u123456
  SSH_PRIVATE_KEY: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    [YOUR PRIVATE KEY HERE]
    -----END OPENSSH PRIVATE KEY-----

---
# ConfigMap for backup configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: pocketbase-backup-config
  namespace: transharbor
data:
  # Retention policy
  KEEP_DAILY: "7"
  KEEP_WEEKLY: "4"
  KEEP_MONTHLY: "12"
  
  # PocketBase data directory
  PB_DATA_DIR: "/pb_data"
