---
# Network policies for transharbor namespace
# Minimal security with negligible performance impact
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pocketbase-policy
  namespace: transharbor
spec:
  podSelector:
    matchLabels:
      app: pocketbase
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from web pods only
  - from:
    - podSelector:
        matchLabels:
          app: web
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Allow external HTTPS (for PocketBase updates, etc)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-policy
  namespace: transharbor
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: 80
  egress:
  # Allow to PocketBase
  - to:
    - podSelector:
        matchLabels:
          app: pocketbase
    ports:
    - protocol: TCP
      port: 8080
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
---
# Default deny ingress for namespace (allow only what's explicitly permitted)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: transharbor
spec:
  podSelector: {}
  policyTypes:
  - Ingress
