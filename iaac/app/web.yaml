apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config-app
  namespace: transharbor
data:
  nginx.conf: |
    server {
      listen 80;
      server_name app.transharbor.org;
      root /usr/share/nginx/html;
      index index.html;

      # Enable gzip
      gzip on;
      gzip_vary on;
      gzip_min_length 1024;
      gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

      # Security headers
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;

      # Flutter web routing
      location / {
        try_files $uri $uri/ /index.html;
      }

      # Proxy API requests to PocketBase
      location /api/ {
        proxy_pass http://pocketbase-app:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /_/ {
        proxy_pass http://pocketbase-app:8080/_/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }

      # Cache static assets
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }

      # Health check
      location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: transharbor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
      env: app
  template:
    metadata:
      labels:
        app: web
        env: app
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: web
        image: ghcr.io/transharbor-org/transharbor/web:main
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        env:
        - name: POCKETBASE_URL
          value: "http://pocketbase-app:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: web-app
  namespace: transharbor
spec:
  selector:
    app: web
    env: app
  ports:
  - port: 80
    targetPort: 80
