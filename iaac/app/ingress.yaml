apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transharbor-app
  namespace: transharbor
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - app.transharbor.org
    secretName: app-transharbor-tls
  rules:
  - host: app.transharbor.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-app
            port:
              number: 80
