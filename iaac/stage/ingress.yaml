apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transharbor-stage
  namespace: transharbor
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - stage.transharbor.org
    secretName: stage-transharbor-tls
  rules:
  - host: stage.transharbor.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-stage
            port:
              number: 80
