apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pocketbase-data-stage
  namespace: transharbor
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocketbase-stage
  namespace: transharbor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pocketbase
      env: stage
  template:
    metadata:
      labels:
        app: pocketbase
        env: stage
    spec:
      containers:
      - name: pocketbase
        image: ghcr.io/transharbor-org/transharbor/pocketbase:main
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        volumeMounts:
        - name: data
          mountPath: /pb_data
        env:
        - name: PB_ADMIN_EMAIL
          value: "admin@transharbor.org"
        - name: PB_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pocketbase-admin-stage
              key: password
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pocketbase-data-stage
---
apiVersion: v1
kind: Service
metadata:
  name: pocketbase-stage
  namespace: transharbor
spec:
  selector:
    app: pocketbase
    env: stage
  ports:
  - port: 8080
    targetPort: 8080
