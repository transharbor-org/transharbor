apiVersion: v1
kind: Secret
metadata:
  name: encryption-key
  namespace: transharbor
type: Opaque
stringData:
  # Platform encryption key for server-side encryption
  # This is a 32-character key for AES-256
  # In production, generate with: openssl rand -base64 32
  # DO NOT commit the actual production key to git!
  ENCRYPTION_KEY: "dev-encryption-key-change-me!!"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: encryption-config
  namespace: transharbor
data:
  # Fields to encrypt (comma-separated)
  ENCRYPTED_FIELDS: "content,bio,location"
  
  # Enable encryption (set to "false" to disable)
  ENCRYPTION_ENABLED: "true"
